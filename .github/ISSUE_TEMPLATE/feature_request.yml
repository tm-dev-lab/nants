name: Feature request
description: Suggest an idea or an improvement for Nants.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine Nants could help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples or anything else that helps.
