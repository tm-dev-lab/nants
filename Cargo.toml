[package]
name = "nants"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tm-dev-lab/nants"
homepage = "https://nants.tmdevlab.com"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
libc = "0.2.190"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false }
rust-embed = { version = "8", default-features = false, features = ["debug-embed"] }
# Dispositivos autorizados (spec 112): tokens do gerador seguro do sistema e hash SHA-256.
# As duas já estavam no Cargo.lock (dependências de outras crates); nada de openssl.
getrandom = "0.2"
sha2 = "0.11"
# Conexão pelo plano ChatGPT (spec 116): RS256 do ID token pelo `ring` e base64url do JWT. As duas
# já estavam no Cargo.lock (o `ring` vem do rustls); nenhuma dependência nova de criptografia.
ring = "0.17"
base64 = "0.22"
# Base de conhecimento (spec 134/T02): texto de PDF. Rust puro (MIT), sem C; escolhida por
# medição em 20 PDFs reais contra pdf-extract, pdf_oxide, oxidize-pdf e lopdf (números na T02).
# Sem as features padrão (`ai`, `refine`, `fast-parse`): só a leitura do texto.
unpdf = { version = "0.51", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
